  else if(act==='hidehelp'){S.ui.help=false;save();render(true)}
  else if(act==='moredays'){planDays+=14;render(true)}
  else if(act==='dayset'){var h=parseFloat($('#dayh').value);if(!isNaN(h)&&h>=0)dayChange(h)}
  else if(act==='dayoff')dayChange(0);
  else if(act==='export'){try{var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='re-launch-mmnds-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}catch(e){toast('Esportazione non riuscita')}}
  else if(act==='import')$('#imp').click();
  else if(act==='reset'){if(window.confirm('Azzerare tutti i dati di questa agenda? L\'operazione non si può annullare.')){S=norm(null);SIM=null;save();render();toast('Agenda azzerata')}}
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='imp'){var f=el.files&&el.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.settings||!o.t)throw 0;S=norm(o);SIM=null;save();render();toast('Backup importato')}catch(e){toast('File non valido')}};rd.readAsText(f);return}
  var nt=el.getAttribute&&el.getAttribute('data-note');if(nt){ts(nt).note=el.value;save();return}
  var kp=el.getAttribute&&el.getAttribute('data-kpi');if(kp){var m=S.ui.month||$('[data-kpisel]').value;S.ui.month=m;S.kpi[m]=S.kpi[m]||{};S.kpi[m][kp]=el.value;save();render(true);return}
  if(el.hasAttribute&&el.hasAttribute('data-kpisel')){S.ui.month=el.value;save();render(true);return}
  var se=el.getAttribute&&el.getAttribute('data-set');if(se){var before=planMap(sim()),val=se==='start'?el.value:parseFloat(el.value);if(se==='start'&&!val)return;if(se!=='start'&&isNaN(val))return;S.settings[se]=val;SIM=null;save();render(true);toast('Piano ricalcolato');return}
  var dy=el.getAttribute&&el.getAttribute('data-day');if(dy!==null&&dy!==undefined&&el.type==='checkbox'&&el.hasAttribute('data-day')){var d=+dy,ix=S.settings.days.indexOf(d);if(el.checked&&ix<0)S.settings.days.push(d);if(!el.checked&&ix>=0)S.settings.days.splice(ix,1);SIM=null;save();render(true);toast('Piano ricalcolato')}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet()});
render();
window.__RELAUNCH__={sim:sim,S:function(){return S},complete:complete,planMap:planMap,TASKS:TASKS};
})();
</script>
